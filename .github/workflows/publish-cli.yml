name: Release CLI

# Bumps the CLI version on main and pushes the checkoutpage-cli-v<version> tag. The tag starts
# checkoutpage-cli-release.yml (generated by dist), which builds, publishes and announces.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      TAG: checkoutpage-cli-v${{ github.event.inputs.version }}

    steps:
      - name: Check inputs
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set. See cli/CLAUDE.md, Releasing."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version like 0.2.0"
            exit 1
          fi

      # A tag pushed with the default GITHUB_TOKEN does not start other workflows, so the push
      # uses RELEASE_TOKEN to trigger the dist release workflow.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check the tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Install toolchain from rust-toolchain.toml
        working-directory: cli
        run: rustup toolchain install

      - name: Update version
        working-directory: cli
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo update --workspace
          actual=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "checkoutpage-cli") | .version')
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Cargo.toml has version $actual after the bump, expected $VERSION"
            exit 1
          fi
          git diff --stat

      - name: Run tests
        working-directory: cli
        run: cargo test --locked

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cli/Cargo.toml cli/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(cli): release $VERSION"
          fi
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

name: Publish Zapier app

# Pushes a new private version to Zapier and sets its environment. It never promotes or
# migrates users: those steps stay manual, see zapier/README.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to push (X.Y.Z, greater than zapier/package.json)'
        required: true
        type: string

concurrency:
  group: publish-zapier
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: zapier

    env:
      VERSION: ${{ inputs.version }}
      DISABLE_ZAPIER_ANALYTICS: '1'

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::Run this workflow from main, not $GITHUB_REF"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_TOKEN can push to a protected main; GITHUB_TOKEN works while main is open.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check version, tag and changelog
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          new=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")

          current=$(node -p "require('./package.json').version")
          IFS=. read -r -a cur <<< "$current"
          greater=false
          for i in 0 1 2; do
            if (( new[i] > cur[i] )); then greater=true; break; fi
            if (( new[i] < cur[i] )); then break; fi
          done
          if [ "$greater" != true ]; then
            echo "::error::$VERSION is not greater than package.json's $current"
            exit 1
          fi

          tag="zapier-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          if ! grep -qxF "## $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section: zapier-platform promote needs it"
            exit 1
          fi

      - name: Check Zapier configuration
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
          ZAPIER_API_URL: ${{ vars.ZAPIER_API_URL }}
        run: |
          if [ -z "$ZAPIER_DEPLOY_KEY" ]; then
            echo "::error::the ZAPIER_DEPLOY_KEY secret is not set"
            exit 1
          fi
          if ! [[ "$ZAPIER_API_URL" =~ ^https://[^[:space:]]+/api/v1$ ]]; then
            echo "::error::the ZAPIER_API_URL variable must be an https URL ending in /api/v1"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: zapier/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test -- --ci

      - name: Validate
        run: npm run validate

      # Zapier first: if the git push below fails, a rerun passes the tag check and overwrites
      # the same unpromoted version on Zapier.
      - name: Push to Zapier
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: npx zapier-platform push

      - name: Set the version's environment
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
          ZAPIER_API_URL: ${{ vars.ZAPIER_API_URL }}
        run: npx zapier-platform env:set "$VERSION" "API_URL=$ZAPIER_API_URL"

      - name: Commit the version bump and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(zapier): release v$VERSION"
          git tag "zapier-v$VERSION"
          git push origin HEAD:main
          git push origin "zapier-v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v h="## $VERSION" '$0 == h { on = 1; next } on && /^##? / { exit } on' CHANGELOG.md)
          gh release create "zapier-v$VERSION" \
            --title "Zapier app v$VERSION" \
            --notes "$notes

          Pushed to Zapier as a private version. Promote and migrate by hand: see zapier/README.md."

name: Test Make app

on:
  push:
    branches: [main]
    paths:
      - 'make/**'
      - 'spec/**'
      - '.prettierrc'
      - '.github/workflows/test-make.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'make/**'
      - 'spec/**'
      - '.prettierrc'
      - '.github/workflows/test-make.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: make

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: make/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      # Generated interfaces are committed, so regenerating from the spec must change nothing.
      - name: Check generated interfaces
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- app)" ]; then
            git status --short -- app
            git diff -- app
            echo "::error::make/app is out of date with the spec: run npm run generate in make/ and commit the result"
            exit 1
          fi
